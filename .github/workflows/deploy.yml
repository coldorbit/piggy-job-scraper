name: Build and Deploy Scraper

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-scraper-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

  WATCH_SERVICES: >-
    jobright-watch
    jobright-ca-watch
    builtin-watch
    remotehunter-watch
    hiringcafe-watch

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve image name
        id: image
        shell: bash
        run: |
          echo "name=${REGISTRY}/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:${{ github.sha }}
            ${{ steps.image.outputs.name }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Install SSH key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.HOSTINGER_SSH_KEY }}

      - name: Copy Compose file
        env:
          HOST: ${{ vars.SCRAPER_HOST }}
          USER: ${{ vars.SCRAPER_USER || 'deploy' }}
          DEPLOY_PATH: ${{ vars.SCRAPER_DEPLOY_PATH || '/opt/applypilot/scraper' }}
        shell: bash
        run: |
          set -euo pipefail

          ssh \
            -o StrictHostKeyChecking=accept-new \
            "$USER@$HOST" \
            "mkdir -p '$DEPLOY_PATH'"

          scp \
            -o StrictHostKeyChecking=accept-new \
            docker-compose.yml \
            "$USER@$HOST:$DEPLOY_PATH/docker-compose.yml"

      - name: Deploy scraper
        env:
          HOST: ${{ vars.SCRAPER_HOST }}
          USER: ${{ vars.SCRAPER_USER || 'deploy' }}
          DEPLOY_PATH: ${{ vars.SCRAPER_DEPLOY_PATH || '/opt/applypilot/scraper' }}

          GHCR_USERNAME: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}

          SCRAPER_IMAGE: ${{ steps.image.outputs.name }}:${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail

          ssh \
            -o StrictHostKeyChecking=accept-new \
            "$USER@$HOST" \
            "DEPLOY_PATH='$DEPLOY_PATH' \
             GHCR_USERNAME='$GHCR_USERNAME' \
             GHCR_TOKEN='$GHCR_TOKEN' \
             SCRAPER_IMAGE='$SCRAPER_IMAGE' \
             WATCH_SERVICES='$WATCH_SERVICES' \
             bash -s" <<'REMOTE'

          set -euo pipefail

          cd "$DEPLOY_PATH"

          echo "$GHCR_TOKEN" \
            | docker login ghcr.io \
                -u "$GHCR_USERNAME" \
                --password-stdin

          export SCRAPER_IMAGE

          docker compose config >/dev/null

          docker compose pull $WATCH_SERVICES

          docker compose up \
            -d \
            --remove-orphans \
            $WATCH_SERVICES

          sleep 5

          docker compose ps

          failed=0

          for service in $WATCH_SERVICES; do
            container_id="$(docker compose ps -q "$service")"

            if [ -z "$container_id" ]; then
              echo "$service did not create a container." >&2
              failed=1
              continue
            fi

            running="$(
              docker inspect \
                -f '{{.State.Running}}' \
                "$container_id"
            )"

            if [ "$running" != "true" ]; then
              echo "$service is not running." >&2
              docker compose logs --tail 100 "$service" >&2 || true
              failed=1
            fi
          done

          if [ "$failed" -ne 0 ]; then
            exit 1
          fi

          docker image prune -f
          REMOTE