x-scraper-image: &scraper_image ${SCRAPER_IMAGE:-sites-scraper:local}

services:
  jobright-watch:
    image: *scraper_image
    build: .
    command:
      - sh
      - -c
      - >-
        exec node sites/jobright/scraper.js
        --country us
        --watch
        --watch-interval-minutes "$${JOBRIGHT_WATCH_INTERVAL_MINUTES:-10}"
        --max-scrolls "$${JOBRIGHT_MAX_SCROLLS:-30}"
        --detail-concurrency "$${JOBRIGHT_DETAIL_CONCURRENCY:-2}"
    env_file:
      - /opt/applypilot/env/scraper.env
    volumes:
      - ./.auth:/app/.auth:ro
    restart: unless-stopped
    init: true
    ipc: host

  jobright-ca-watch:
    image: *scraper_image
    build: .
    command:
      - sh
      - -c
      - >-
        sleep "$${JOBRIGHT_CA_START_DELAY_SECONDS:-300}";
        exec node sites/jobright/scraper.js
        --country ca
        --watch
        --watch-interval-minutes "$${JOBRIGHT_WATCH_INTERVAL_MINUTES:-10}"
        --max-scrolls "$${JOBRIGHT_MAX_SCROLLS:-30}"
        --detail-concurrency "$${JOBRIGHT_DETAIL_CONCURRENCY:-2}"
    env_file:
      - /opt/applypilot/env/scraper.env
    volumes:
      - ./.auth:/app/.auth:ro
    restart: unless-stopped
    init: true
    ipc: host

  jobright-uk-watch:
    image: *scraper_image
    build: .
    command:
      - sh
      - -c
      - >-
        sleep "$${JOBRIGHT_UK_START_DELAY_SECONDS:-600}";
        exec node sites/jobright/scraper.js
        --country uk
        --watch
        --watch-interval-minutes "$${JOBRIGHT_WATCH_INTERVAL_MINUTES:-10}"
        --max-scrolls "$${JOBRIGHT_MAX_SCROLLS:-30}"
        --detail-concurrency "$${JOBRIGHT_DETAIL_CONCURRENCY:-2}"
    env_file:
      - /opt/applypilot/env/scraper.env
    volumes:
      - ./.auth:/app/.auth:ro
    restart: unless-stopped
    init: true
    ipc: host

  builtin-watch:
    image: *scraper_image
    build: .
    command:
      - node
      - sites/builtin/scraper.js
      - --watch
      - --watch-interval-minutes
      - ${WATCH_INTERVAL_MINUTES:-5}
    env_file:
      - /opt/applypilot/env/scraper.env
    restart: unless-stopped
    init: true
    ipc: host

  remotehunter-watch:
    image: *scraper_image
    build: .
    command:
      - node
      - sites/remotehunter/scraper.js
      - --watch
      - --watch-interval-minutes
      - ${WATCH_INTERVAL_MINUTES:-5}
      - --max-scrolls
      - ${REMOTEHUNTER_MAX_SCROLLS:-10}
    env_file:
      - /opt/applypilot/env/scraper.env
    restart: unless-stopped
    init: true
    ipc: host

  hiringcafe-watch:
    image: *scraper_image
    build: .
    command:
      - node
      - sites/hiringcafe/scraper.js
      - --watch
      - --watch-interval-minutes
      - ${WATCH_INTERVAL_MINUTES:-5}
    env_file:
      - /opt/applypilot/env/scraper.env
    restart: unless-stopped
    init: true
    ipc: host

  scrape:
    image: *scraper_image
    build: .
    command:
      - sh
      - -c
      - >
        node sites/jobright/scraper.js --country us --max-scrolls "${JOBRIGHT_MAX_SCROLLS:-30}"
        && node sites/jobright/scraper.js --country ca --max-scrolls "${JOBRIGHT_MAX_SCROLLS:-30}"
        && node sites/jobright/scraper.js --country uk --max-scrolls "${JOBRIGHT_MAX_SCROLLS:-30}"
        && node sites/builtin/scraper.js
        && node sites/remotehunter/scraper.js --max-scrolls "${REMOTEHUNTER_MAX_SCROLLS:-10}"
        && node sites/hiringcafe/scraper.js
    env_file:
      - /opt/applypilot/env/scraper.env
    volumes:
      - ./.auth:/app/.auth:ro
    profiles:
      - manual
    init: true
